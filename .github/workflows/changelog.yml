name: Changelog Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require an Unreleased changelog entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          extract_unreleased() {
            awk '
              /^## \[Unreleased\]$/ { in_unreleased = 1; next }
              in_unreleased && /^## \[/ { exit }
              in_unreleased && /^- / { print }
            '
          }

          git show "${BASE_SHA}:CHANGELOG.md" | extract_unreleased | sort > "${RUNNER_TEMP}/base-unreleased"
          extract_unreleased < CHANGELOG.md | sort > "${RUNNER_TEMP}/head-unreleased"
          comm -13 "${RUNNER_TEMP}/base-unreleased" "${RUNNER_TEMP}/head-unreleased" | grep -qE '^- '
