name: PR CI

on:
  pull_request:
    branches: [ "**" ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install
        run: bun ci
      - name: Type Check
        run: bun run type-check
      - name: Lint
        run: bun run lint
      - name: Architecture Lint
        run: bun run lint:architecture
      - name: Test
        run: bun run test
